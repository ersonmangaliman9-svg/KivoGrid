<!doctype html><html lang="en"><head><meta charset="utf-8"><title>KIVO Grid - Photo Grid Maker</title><meta name="description" content="Create stunning 2-9 photo grids with filters, creative templates and motion. Free, runs in your browser."><meta name="theme-color" id="themeColor" content="#e4e0d7"><link rel="icon" type="image/png" href="logo.png"><link rel="apple-touch-icon" href="logo.png"><meta property="og:title" content="KIVO Grid"><meta property="og:description" content="Photo grid maker with filters, templates and motion."><meta property="og:image" content="logo.png"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
<style>:root {
  --navy: #0a1a4a;
  --ink: #0a1a4a;
  --blue: #2aa4ff;
  --page: #e4e0d7;
  --tile: rgba(10, 26, 74, 0.07);
  --chip: rgba(10, 26, 74, 0.08);
  --chip-on-bg: #081635;
  --chip-on-fg: #fff;
  --muted: rgba(10, 26, 74, 0.55);
  --strip-bg: #f1ede5;
  --tab-on-bg: #081635;
  --tab-on-fg: #fff;
  --shadow: 0 18px 40px rgba(40, 32, 18, 0.18);
  --card: #f3efe7;
  color-scheme: light;
}
html[data-theme='dark'] {
  --ink: #fff;
  --page: #0a1448;
  --tile: rgba(255, 255, 255, 0.08);
  --chip: rgba(255, 255, 255, 0.1);
  --chip-on-bg: #2aa4ff;
  --chip-on-fg: #fff;
  --muted: rgba(255, 255, 255, 0.6);
  --strip-bg: rgba(255, 255, 255, 0.07);
  --tab-on-bg: #fff;
  --tab-on-fg: #081635;
  --shadow: 0 18px 44px rgba(0, 0, 0, 0.45);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--page); }
html { background: var(--page); transition: background 0.35s; }
html[data-theme='dark'] { background: radial-gradient(120% 80% at 50% 0%, #12307f 0%, #0a1448 45%, #050b26 100%) fixed; }
body {
  font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color: var(--ink);
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

#app {
  width: 100%;
  max-width: 560px;
  min-height: 100dvh;
  padding: max(12px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
  gap: 8px;
  position: relative;
}

.top { display: flex; align-items: center; justify-content: space-between; height: 46px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 15px; letter-spacing: 0.02em; }
.brand img { border-radius: 50%; display: block; box-shadow: 0 0 0 1.5px rgba(42, 164, 255, 0.55); }
.export-btn {
  background: #081635; color: #fff; font-weight: 800; font-size: 16px;
  height: 42px; padding: 0 24px; border-radius: 999px; box-shadow: 0 6px 16px rgba(8, 22, 53, 0.25);
}
html[data-theme='dark'] .export-btn { background: #fff; color: #081635; }
.export-btn:active { transform: scale(0.96); }

.titleblock { text-align: center; padding-top: 2px; min-height: 76px; }
#title {
  margin: 0; font-weight: 900; text-transform: uppercase; letter-spacing: -0.04em; line-height: 1;
  font-size: clamp(28px, 8.4vw, 40px); color: var(--ink);
  text-shadow: 3px 3px 0 rgba(42, 164, 255, 0.35);
}
.subrow { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px; }
.subchip {
  background: var(--blue); color: #fff; font-weight: 800; font-size: 11.5px; letter-spacing: 0.08em;
  padding: 6px 14px; border-radius: 999px; text-transform: uppercase; white-space: nowrap;
}
.arrow {
  width: 28px; height: 28px; border-radius: 50%; background: var(--chip); font-size: 22px; line-height: 24px; font-weight: 700;
  display: grid; place-items: center;
}
.arrow[hidden] { display: none; }
.arrow:active { transform: scale(0.9); }

.stage { display: flex; justify-content: center; padding: 8px 0 4px; }
.card {
  position: relative; width: min(100%, max(240px, calc(100dvh - 430px)));
  aspect-ratio: 1; border-radius: 34px; box-shadow: var(--shadow);
}
.cardclip { position: absolute; inset: 0; border-radius: 34px; overflow: hidden; background: var(--card); }
#cv { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
.sticker {
  position: absolute; top: -14px; right: -6px; transform: rotate(-3.5deg);
  background: var(--blue); color: #0a1a4a; font-weight: 900; font-size: 13.5px; letter-spacing: 0.01em; text-transform: uppercase;
  padding: 8px 14px; border-radius: 12px; box-shadow: 4px 4px 0 #0a1a4a; border: 2px solid #0a1a4a; pointer-events: none;
  animation: pop 0.45s cubic-bezier(0.2, 1.6, 0.4, 1);
}
html[data-theme='dark'] .sticker { box-shadow: 4px 4px 0 #04103a; }
@keyframes pop { from { transform: rotate(-3.5deg) scale(0.4); opacity: 0; } }

.stripwrap { display: flex; flex-direction: column; align-items: center; gap: 7px; }
.strip { width: 100%; display: grid; grid-template-columns: repeat(9, 1fr); gap: 5px; padding: 6px; background: var(--strip-bg); border-radius: 20px; }
.thumb { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--tile); display: grid; place-items: center; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
.thumb.empty { border: 1.5px dashed var(--muted); background: transparent; color: var(--muted); font-size: 16px; font-weight: 700; }
.thumb.sel { outline: 3px solid var(--blue); outline-offset: -1px; }
.thumb.dim { opacity: 0.45; }
.thumb .x {
  position: absolute; top: 2px; right: 2px; width: 16px; height: 16px; border-radius: 50%;
  background: #081635; color: #fff; font-size: 12px; line-height: 16px; font-weight: 800; text-align: center;
}
.caption { font-size: 10.5px; font-weight: 800; letter-spacing: 0.12em; color: var(--muted); }

.ctx { min-height: 48px; display: flex; align-items: center; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px; width: 100%; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 18px; border-radius: 999px;
  background: var(--chip); font-weight: 700; font-size: 15px; white-space: nowrap;
}
.chip.on { background: var(--chip-on-bg); color: var(--chip-on-fg); }
.chip .pro { margin-left: 6px; padding: 2px 6px; border-radius: 6px; font-size: 9px; font-weight: 800; letter-spacing: 0.08em; color: #3a2a06; background: linear-gradient(135deg, #f7e7a6, #c9a24b); }
.chip .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.35); }
.nums { display: flex; justify-content: space-between; width: 100%; padding: 0 6px; }
.num {
  width: 38px; height: 38px; border-radius: 50%; background: var(--chip); font-weight: 800; font-size: 16px; display: grid; place-items: center;
}
.num.on { background: var(--chip-on-bg); color: var(--chip-on-fg); box-shadow: 0 0 0 3px rgba(42, 164, 255, 0.5); }
.actions { display: flex; gap: 8px; width: 100%; }
.act {
  flex: 1; height: 42px; border-radius: 999px; background: var(--chip); font-weight: 800; font-size: 14px; padding: 0 12px; white-space: nowrap;
}
.act.primary { background: var(--blue); color: #fff; }
.hint { width: 100%; text-align: center; font-size: 11.5px; font-weight: 800; letter-spacing: 0.1em; color: var(--muted); text-transform: uppercase; }

.tabs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; padding-top: 2px; margin-top: auto; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.tab .ico { width: 54px; height: 54px; border-radius: 18px; background: var(--tile); display: grid; place-items: center; transition: background 0.2s, transform 0.2s; }
.tab svg { width: 26px; height: 26px; fill: currentColor; }
.tab .lbl { font-size: 12px; font-weight: 700; color: var(--muted); }
.tab.on .ico { background: var(--tab-on-bg); color: var(--tab-on-fg); transform: translateY(-2px); box-shadow: 0 8px 18px rgba(8, 22, 53, 0.3); }
.tab.on .lbl { color: var(--ink); }
.tab:active .ico { transform: scale(0.94); }

.modal, .busy { position: fixed; inset: 0; z-index: 50; background: rgba(4, 10, 32, 0.6); display: grid; place-items: center; padding: 20px; backdrop-filter: blur(3px); }
.modal[hidden], .busy[hidden], .toast[hidden], [hidden] { display: none !important; }
.sheet, .busybox { width: min(100%, 400px); background: #fff; color: #081635; border-radius: 30px; padding: 22px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 30px 80px rgba(0,0,0,0.5); animation: pop2 0.28s cubic-bezier(0.2, 1.4, 0.4, 1); }
@keyframes pop2 { from { transform: translateY(24px) scale(0.96); opacity: 0; } }
.sheet h2 { margin: 0 0 6px; text-align: center; font-weight: 900; font-size: 26px; letter-spacing: -0.03em; }
.sheet h2 span { color: var(--blue); }
.opt {
  display: flex; flex-direction: column; align-items: center; gap: 3px; background: #081635; color: #fff; border-radius: 999px; padding: 14px 18px;
  text-decoration: none; font-size: 17px;
}
.opt small { font-size: 12px; opacity: 0.7; font-weight: 500; }
.opt.fb { background: #1877f2; font-weight: 800; }
.cancel { background: #eef1f7; color: #081635; border-radius: 999px; padding: 14px; font-weight: 800; font-size: 16px; }
.busybox { align-items: center; text-align: center; font-weight: 800; font-size: 18px; }
.busybox small { font-weight: 500; font-size: 12px; opacity: 0.65; }
.bar { width: 100%; height: 10px; background: #e3e8f4; border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #2aa4ff, #5cd0ff); transition: width 0.15s linear; }

.toast {
  position: fixed; left: 50%; bottom: calc(110px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 60;
  background: #081635; color: #fff; padding: 12px 18px; border-radius: 16px; font-weight: 700; font-size: 14px; max-width: min(92vw, 420px); text-align: center;
  box-shadow: 0 12px 30px rgba(0,0,0,0.35); animation: pop2 0.25s ease;
}
html[data-theme='dark'] .toast { background: #fff; color: #081635; }

@media (max-width: 380px) {
  .tab .ico { width: 48px; height: 48px; border-radius: 16px; }
  .chip { font-size: 14px; padding: 0 14px; }
  .num { width: 34px; height: 34px; }
}
@media (prefers-reduced-motion: reduce) { .sticker, .sheet, .toast { animation: none; } }
</style>

  <div id="app">
    <header class="top">
      <div class="brand"><img src="logo.png" alt="" width="34" height="34" /><span>KIVO GRID</span></div>
      <button id="exportBtn" class="export-btn" type="button">Export</button>
    </header>

    <section class="titleblock" aria-live="polite">
      <h1 id="title">MEET KIVO GRID</h1>
      <div class="subrow">
        <button id="prevBtn" class="arrow" type="button" aria-label="Previous">‹</button>
        <span id="subchip" class="subchip">ADD 2 TO 9 PHOTOS</span>
        <button id="nextBtn" class="arrow" type="button" aria-label="Next">›</button>
      </div>
    </section>

    <section class="stage">
      <div class="card" id="card">
        <div class="cardclip"><canvas id="cv" aria-label="Photo grid preview"></canvas></div>
        <div class="sticker" id="sticker">UPLOAD ONCE</div>
      </div>
    </section>

    <section class="stripwrap">
      <div class="strip" id="strip"></div>
      <div class="caption" id="caption">1 UPLOAD PER PHOTO</div>
    </section>

    <section class="ctx" id="ctx"></section>

    <nav class="tabs" id="tabs" aria-label="Editor tools">
      <button class="tab" data-tab="layout" type="button"><span class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="18" rx="2.2"/><rect x="13" y="3" width="8" height="8" rx="2.2"/><rect x="13" y="13" width="8" height="8" rx="2.2"/></svg></span><span class="lbl">Layout</span></button>
      <button class="tab" data-tab="grid" type="button"><span class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="5" height="5" rx="1.3"/><rect x="9.5" y="3" width="5" height="5" rx="1.3"/><rect x="16" y="3" width="5" height="5" rx="1.3"/><rect x="3" y="9.5" width="5" height="5" rx="1.3"/><rect x="9.5" y="9.5" width="5" height="5" rx="1.3"/><rect x="16" y="9.5" width="5" height="5" rx="1.3"/><rect x="3" y="16" width="5" height="5" rx="1.3"/><rect x="9.5" y="16" width="5" height="5" rx="1.3"/><rect x="16" y="16" width="5" height="5" rx="1.3"/></svg></span><span class="lbl">Grid</span></button>
      <button class="tab" data-tab="filter" type="button"><span class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="2.4" rx="1.2"/><rect x="3" y="10.8" width="18" height="2.4" rx="1.2"/><rect x="3" y="16.6" width="18" height="2.4" rx="1.2"/><circle cx="8" cy="6.2" r="3"/><circle cx="16" cy="12" r="3"/><circle cx="10" cy="17.8" r="3"/></svg></span><span class="lbl">Filter</span></button>
      <button class="tab" data-tab="strip" type="button"><span class="ico"><svg viewBox="0 0 24 24"><path fill-rule="evenodd" d="M7 2h10a3 3 0 0 1 3 3v14a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V5a3 3 0 0 1 3-3zm1.5 5a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6zm7 0a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6zm-7 4.7a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6zm7 0a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6zm-7 4.7a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6zm7 0a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6z"/></svg></span><span class="lbl">Strip</span></button>
      <button class="tab" data-tab="motion" type="button"><span class="ico"><svg viewBox="0 0 24 24"><path d="M10 2c.6 4.6 3.4 7.4 8 8-4.6.6-7.4 3.4-8 8-.6-4.6-3.4-7.4-8-8 4.6-.6 7.4-3.4 8-8z"/><path d="M19 15c.3 2.1 1.4 3.2 3.5 3.5-2.1.3-3.2 1.4-3.5 3.5-.3-2.1-1.4-3.2-3.5-3.5 2.1-.3 3.2-1.4 3.5-3.5z"/></svg></span><span class="lbl">Motion</span></button>
      <button class="tab" data-tab="swap" type="button"><span class="ico"><svg viewBox="0 0 24 24"><path d="M7 4 2.5 8.5 7 13v-3h9V7H7V4zm10 7v3H8v3h9v3l4.5-4.5L17 11z"/></svg></span><span class="lbl">Swap</span></button>
    </nav>

    <input id="file" type="file" accept="image/*" multiple hidden />

    <div class="modal" id="modal" hidden>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <h2 id="sheetTitle">EXPORT <span>GRID</span></h2>
        <button class="opt" id="savePng" type="button"><b>Save image</b><small>PNG, 2160 × 2160</small></button>
        <button class="opt" id="saveReel" type="button"><b>Save animated reel</b><small id="reelSub">Vertical video with your current motion</small></button>
        <a class="opt fb" id="fbLink" target="_blank" rel="noopener" hidden>Message KIVO on Facebook</a>
        <button class="cancel" id="closeModal" type="button">Cancel</button>
      </div>
    </div>

    <div class="busy" id="busy" hidden>
      <div class="busybox">
        <div id="busyText">Working…</div>
        <div class="bar" id="busyBar" hidden><i id="busyFill"></i></div>
        <small id="busyHint" hidden>Keep this tab open and in front while the reel records.</small>
        <button class="cancel" id="busyCancel" type="button" hidden>Cancel</button>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </div>
  

<script type="module" src="js/main.js"></script>

</body></html>
